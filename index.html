<head>
    <link rel="stylesheet" href="css/config.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages.css">

    <link rel="stylesheet" href="css/home.css">

    <link rel="stylesheet" href="css/end.css">

    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/girl.css">
    <link rel="stylesheet" href="css/girl-selection.css">

    <link rel="stylesheet" href="css/convo.css">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
    </style>

    <script type="module">
        import OpenAI from "https://esm.sh/openai"

        function initOpenAI(key) {
            const oai = new OpenAI({ apiKey: key, dangerouslyAllowBrowser: true })
            window.openai = oai
        }
        window.initOpenAI = initOpenAI
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"

        const firebaseConfig = {
        apiKey: "AIzaSyCmjvm1duQeqh9G-P5BqQR8ev-W00J4Yjs",
        authDomain: "bag-a-baddie.firebaseapp.com",
        projectId: "bag-a-baddie",
        storageBucket: "bag-a-baddie.firebasestorage.app",
        messagingSenderId: "230030096772",
        appId: "1:230030096772:web:84f2ae6ee2347cdae005d1"
        }

        const app = initializeApp(firebaseConfig)



        const db = getFirestore(app)

        async function submitScore(name, score, time, messages) {
            await addDoc(collection(db, "highscores"), {
                name: name,
                score: score,
                time: time,
                messages: messages,
                timestamp: Date.now()
            })
        }

        async function getHighscores() {
            const q = query(
                collection(db, "highscores"),
                orderBy("score", "desc"),
                limit(10)
            )
            const snapshot = await getDocs(q)
            return snapshot.docs.map(doc => doc.data())
        }

        window.submitScore = submitScore
        window.getHighscores = getHighscores
    </script>

    <script src="js/secrets.js"></script>
    <script src="js/character_data.js"></script>
    <script src="js/tools_data.js"></script>
    <script src="js/girl_options_data.js"></script>
    <script src="js/base.js"></script>
    <script src="js/prompt.js"></script>
    <script src="js/game.js"></script>
    <script src="js/end.js"></script>
    <script src="js/home.js"></script>
</head>
<body>
    <section class="page hidden" id="game" data-init-script="initGame">
        <div class="bar hidden" id="bar-1">
            <img class="bg" src="assets/bars/bar-1.png">

            <span id="timer"></span>

            <div id="girl-selection">
                <h2 data-text="Hvem vil du score?">Hvem vil du score?</h2>
            </div>
            <div class="girl">
                <img class="avatar" src="">
            </div>
            <audio class="music" src="assets/music/bar-1.wav" loop></audio>
        </div>

        <div id="convo">
            <form id="user-input">
                <input type="text">
                <button type="submit">></button>
            </form>
            <div id="ai-response">
                <span></span>
            </div>
        </div>
        <script src="js/convo.js"></script>
        

        <script src="js/bars.js"></script>
    </section>
    <section class="page hidden" id="end" data-init-script="initEnd">
        <img class="bg" src="assets/end-background.png">
        <h2>Du blev <span id="result">...</span></h2>
        <div id="stats">
            <span class="stat">Du sendte: <span></span></span>
            <span class="stat">Du brugte: <span></span></span>
            <span id="score" class="stat">Samlet score: <span></span></span>
        </div>
        <div id="nav-btns">
            <a onclick="switchPage('game')">Spil igen</a>
            <a onclick="switchPage('home')">Hjem</a>
        </div>
        <audio class="music" src="assets/music/home.wav" loop></audio>
        <script>
            (()=>{
                const script = document.currentScript
                document.addEventListener('click', () => {
                    const audio = script.previousElementSibling;
                    audio.volume = 0.4;
                    audio.play();
                }, { once: true })
            })()
        </script>
    </section>
    <section class="page" id="home" data-init-script="initHome">
        <img class="bg" src="assets/home-background.png">
        <h1>
            <img src="assets/logo.png" alt="Bag A Baddie">
        </h1>
        <div id="menus">
            <input type="text" id="openai-key" placeholder="OpenAI API Key">
            <script>
                (()=>{
                    const openai_input = document.querySelector('#openai-key')
                    openai_input.addEventListener('change', ()=>{
                        OPENAI_KEY = openai_input.value;
                        window.localStorage.setItem('openai', OPENAI_KEY)
                        window.initOpenAI(OPENAI_KEY)
                    })

                    window.addEventListener('load', () => {
                        openai_input.value = window.localStorage.getItem('openai') || ''
                        if (openai_input.value && window.initOpenAI) {
                            window.initOpenAI(openai_input.value)
                        }
                    })
                })()
            </script>
            <input type="text" id="name" placeholder="Dit navn">
            <script>
                (()=>{
                    const name = document.querySelector('#name')
                    name.addEventListener('change', ()=>{
                        NAME = this.value;
                        window.localStorage.setItem('name', NAME)
                    })
                    name.value = window.localStorage.getItem('name')
                })()
            </script>
            <a id="start-btn" onclick="switchPage('game')">Start</a>
        </div>
        <div id="highscores">
            <table>
                <thead>
                    <tr>
                        <th>Navn</th>
                        <th>Tid</th>
                        <th>Beskeder</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <audio class="music" src="assets/music/home.wav" loop></audio>
        <script>
            (()=>{
                const script = document.currentScript
                document.addEventListener('click', () => {
                    const audio = script.previousElementSibling;
                    audio.volume = 0.4;
                    audio.play();
                }, { once: true })
            })()
        </script>
    </section>

    <script src="js/pages.js"></script>
</body>
