<head>
    <link rel="stylesheet" href="css/config.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages.css">

    <link rel="stylesheet" href="css/home.css">

    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/girl.css">
    <link rel="stylesheet" href="css/girl-selection.css">

    <link rel="stylesheet" href="css/convo.css">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
    </style>

    <script type="module">
        import OpenAI from "https://esm.sh/openai"

        const oai = new OpenAI({ apiKey: OPENAI_KEY, dangerouslyAllowBrowser: true })
        window.openai = oai
    </script>
    <script src="js/secrets.js"></script>
    <script src="js/character_data.js"></script>
    <script src="js/tools_data.js"></script>
    <script src="js/girl_options_data.js"></script>
    <script src="js/base.js"></script>
    <script src="js/prompt.js"></script>
</head>
<body>
    <section class="page hidden" id="game">
        <div class="bar hidden" id="bar-1">
            <img class="bg" src="assets/bars/bar-1.png">
            <div id="girl-selection">
                <h2 data-text="Hvem vil du score?">Hvem vil du score?</h2>
            </div>
            <div class="girl">
                <img class="avatar" src="">
            </div>
            <audio class="music" src="assets/music/bar-1.wav" loop></audio>
        </div>

        <div id="convo">
            <form id="user-input">
                <input type="text">
                <button type="submit">></button>
            </form>
            <div id="ai-response">
                <span></span>
            </div>
        </div>
        <script src="js/convo.js"></script>
        

        <script src="js/bars.js"></script>
    </section>
    <section class="page hidden" id="end"></section>
    <section class="page" id="home">
        <img class="bg" src="assets/home-background.png">
        <h1>
            <img src="assets/logo.png" alt="Bag A Baddie">
        </h1>
        <div id="menus">
            <input type="text" id="openai-key" placeholder="OpenAI API Key">
            <script>
                (()=>{
                    const openai_input = document.querySelector('#openai-key')
                    openai_input.addEventListener('change', ()=>{
                        OPENAI_KEY = this.value;
                        window.localStorage.setItem('openai', OPENAI_KEY)
                    })
                    openai_input.value = window.localStorage.getItem('openai')
                })()
            </script>
            <a id="start-btn" onclick="switchPage('game');loadBar(1);populateBars()">Start</a>
        </div>
    </section>

    <script src="js/pages.js"></script>
</body>
